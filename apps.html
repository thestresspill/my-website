<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Apps | The Stressed Mindscape</title>
    <style>
        :root {
            --bg-top: #0f2027;
            --bg-mid: #14384a;
            --bg-bottom: #0b1c26;
            --accent: #2ec4b6;
            --card-bg: #12303f;
            --card-border: rgba(46, 196, 182, 0.35);
            --text-main: #f4f1ea;
            --text-muted: #b9c6c9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: var(--text-main);
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bottom) 100%);
            padding: 40px 0 60px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            padding: 0 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .back-link:hover {
            color: var(--accent);
        }

        /* Hero cover card */
        .hero {
            position: relative;
            overflow: hidden;
            border-radius: 22px;
            padding: 32px 24px 26px;
            margin-bottom: 16px;
            background:
                radial-gradient(circle at 20% 20%, rgba(46, 196, 182, 0.35), transparent 55%),
                radial-gradient(circle at 90% 80%, rgba(76, 107, 255, 0.3), transparent 55%),
                linear-gradient(160deg, #123344 0%, #0a1e29 100%);
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .hero h1 {
            font-size: 1.9em;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 0 0 8px;
        }

        .hero p {
            font-size: 0.85em;
            font-weight: 500;
            color: var(--text-muted);
            margin: 0;
        }

        .section-label {
            font-size: 0.75em;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            margin: 28px 0 14px 4px;
        }

        /* App tile grid */
        .tile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .app-tile {
            display: flex;
            flex-direction: column;
            background-color: var(--card-bg);
            color: var(--text-main);
            text-decoration: none;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        .app-tile:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
        }

        .app-thumb {
            width: 100%;
            height: 84px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.1em;
            background: linear-gradient(135deg, rgba(46, 196, 182, 0.25), rgba(46, 196, 182, 0.05));
            border-bottom: 1px dashed var(--card-border);
        }

        .app-info {
            padding: 14px;
        }

        .app-title {
            font-size: 0.95em;
            font-weight: 700;
            margin: 0 0 4px;
            line-height: 1.25;
        }

        .app-desc {
            font-size: 0.78em;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.3;
        }

        /* First tile spans full width as the featured app */
        .app-tile.featured {
            grid-column: span 2;
            flex-direction: row;
            background: linear-gradient(135deg, #17475a 0%, #0e2733 100%);
            border-color: var(--accent);
        }

        .app-tile.featured .app-thumb {
            width: 96px;
            height: auto;
            border-bottom: none;
            border-right: 1px dashed var(--card-border);
        }

        .app-tile.featured .app-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">

        <a class="back-link" href="index.html">&larr; Back to Home</a>

        <div class="hero">
            <h1>My Apps</h1>
            <p>A few things I've built and shipped.</p>
        </div>

        <p class="section-label">Apps</p>

        <div class="tile-grid">

            <a class="app-tile featured" href="https://alpine-pool.web.app/dashboard.html" target="_blank" rel="noopener noreferrer">
                <div class="app-thumb">🧮</div>
                <div class="app-info">
                    <p class="app-title">Math Learning App</p>
                    <p class="app-desc">Interactive dashboard for learning math concepts.</p>
                </div>
            </a>

            <a class="app-tile" href="https://claude-health-tracker-apr2026.vercel.app/" target="_blank" rel="noopener noreferrer">
                <div class="app-thumb">📈</div>
                <div class="app-info">
                    <p class="app-title">Analytics Project</p>
                    <p class="app-desc">Calorie tracker with analytics dashboard.</p>
                </div>
            </a>

            <a class="app-tile" href="https://strive-production-7945.up.railway.app/" target="_blank" rel="noopener noreferrer">
                <div class="app-thumb">📈</div>
                <div class="app-info">
                    <p class="app-title">New Calorie Tracker</p>
                    <p class="app-desc">Latest iteration of the calorie tracker.</p>
                </div>
            </a>

        </div>

    </div>

</body>
</html>
