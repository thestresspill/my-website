<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Stressed Mindscape | All My Links</title>
    <style>
        :root {
            --bg-top: #0f2027;
            --bg-mid: #14384a;
            --bg-bottom: #0b1c26;
            --accent: #2ec4b6;
            --card-bg: #12303f;
            --card-bg-2: #0e2733;
            --card-border: rgba(46, 196, 182, 0.35);
            --text-main: #f4f1ea;
            --text-muted: #b9c6c9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: var(--text-main);
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bottom) 100%);
            padding: 40px 0 60px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            padding: 0 20px;
        }

        /* Hero cover card */
        .hero {
            position: relative;
            overflow: hidden;
            border-radius: 22px;
            padding: 36px 24px 28px;
            margin-bottom: 16px;
            background:
                radial-gradient(circle at 25% 15%, rgba(46, 196, 182, 0.35), transparent 55%),
                radial-gradient(circle at 85% 85%, rgba(76, 107, 255, 0.35), transparent 55%),
                linear-gradient(160deg, #123344 0%, #0a1e29 100%);
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .profile-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
            margin-bottom: 18px;
        }

        .name {
            font-size: 2em;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0 0 10px;
            line-height: 1.1;
        }

        .tagline {
            font-size: 0.85em;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            margin: 0;
        }

        /* Section Labels */
        .section-label {
            font-size: 0.75em;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            margin: 28px 0 14px 4px;
        }

        /* Tile grid */
        .tile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .tile {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 22px;
            background-color: var(--card-bg);
            color: var(--text-main);
            text-decoration: none;
            padding: 18px;
            min-height: 128px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        .tile:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
        }

        .tile .icon {
            font-size: 1.6em;
        }

        .tile .label {
            font-size: 0.95em;
            font-weight: 700;
            line-height: 1.25;
        }

        /* Wide tiles span both columns */
        .tile.wide {
            grid-column: span 2;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            min-height: auto;
            gap: 14px;
        }

        .tile.featured {
            background: linear-gradient(135deg, #17475a 0%, #0e2733 100%);
            border-color: var(--accent);
        }

        .tile.wip {
            opacity: 0.55;
        }

        .badge {
            display: inline-block;
            margin-left: 6px;
            vertical-align: middle;
            font-size: 0.65em;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--bg-bottom);
            background: var(--accent);
            padding: 3px 9px;
            border-radius: 20px;
            text-transform: uppercase;
            white-space: nowrap;
        }
    </style>
</head>
<body>

        <p class="section-label">Links</p>

            target="_blank" rel="noopener noreferrer">
                <span class="icon">🎧</span>
                <span class="label">Published Music</span>
            </a>

            <a class="tile" href="https://thestresspillproject-pnejx.wordpress.com/" target="_blank" rel="noopener noreferrer">

            <a class="tile wide featured" href="apps.html">
                <span class="icon">🧮</span>
                <span class="label">My Apps &mdash; see everything I've built</span>
            </a>

        </div>

    </div>

</body>
</html>
